<!DOCTYPE html>
<html lang="en" class="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INVPRO</title>

    <!-- Bootstrap CSS (Required for Modals) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio&preflight=true"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            200: '#bae6fd',
                            300: '#7dd3fc',
                            400: '#38bdf8',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                            800: '#075985',
                            900: '#0c4a6e',
                        },
                        accent: {
                            50: '#fdf4ff',
                            100: '#fae8ff',
                            200: '#f5d0fe',
                            300: '#f0abfc',
                            400: '#e879f9',
                            500: '#d946ef',
                            600: '#c026d3',
                            700: '#a21caf',
                            800: '#86198f',
                            900: '#701a75',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        display: ['Outfit', 'Inter', 'sans-serif'],
                    },
                    backdropBlur: {
                        xs: '2px',
                    }
                }
            },
            plugins: [
                function ({ addComponents }) {
                    addComponents({
                        '.bento-card': {
                            '@apply glass rounded-3xl p-6 hover:shadow-2xl transition-all duration-300': {},
                        },
                        '.btn-premium': {
                            '@apply px-6 py-3 rounded-xl font-bold text-sm tracking-wide transition-all duration-200 bg-gradient-to-r from-primary-600 to-accent-600 text-white hover:shadow-lg hover:scale-105 active:scale-95': {},
                        },
                        '.nav-logo': {
                            '@apply flex items-center gap-3 no-underline': {},
                        },
                        '.logo-icon': {
                            '@apply w-10 h-10 rounded-xl bg-gradient-to-br from-primary-500 to-accent-500 flex items-center justify-center text-white text-xl shadow-lg': {},
                        },
                        '.nav-item': {
                            '@apply flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all duration-200': {},
                            '&.active': {
                                '@apply bg-gradient-to-r from-primary-500 to-accent-500 text-white shadow-lg': {},
                            },
                            '& i': {
                                '@apply text-lg': {},
                            }
                        },
                        '.time-btn': {
                            '@apply px-4 py-2 rounded-lg text-sm font-bold transition-all duration-200 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400 hover:border-primary-500 hover:text-primary-600 dark:hover:text-primary-400': {},
                            '&.active': {
                                '@apply bg-gradient-to-r from-primary-500 to-accent-500 text-white border-transparent shadow-lg': {},
                            }
                        },
                        '.comparison-time-btn': {
                            '@apply px-3 py-1.5 rounded-lg text-xs font-bold transition-all duration-200 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400 hover:border-primary-500 hover:text-primary-600 dark:hover:text-primary-400': {},
                            '&.active': {
                                '@apply bg-gradient-to-r from-primary-500 to-accent-500 text-white border-transparent shadow-lg': {},
                            }
                        }
                    })
                }
            ]
        }
    </script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <style type="text/tailwindcss">
        /* INVPRO Premium Design System */
        :root {
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.18);
            --shadow-glass: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }

        .dark {
            --glass-bg: rgba(15, 23, 42, 0.7);
            --glass-border: rgba(255, 255, 255, 0.08);
            --shadow-glass: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
        }

        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-glass);
        }

        .glass-strong {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .dark .glass-strong {
            background: rgba(15, 23, 42, 0.9);
        }

        body {
            font-family: 'Inter', sans-serif;
        }

        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        .font-display {
            font-family: 'Outfit', 'Inter', sans-serif;
        }

        /* Smooth transitions */
        * {
            transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.3);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(148, 163, 184, 0.5);
        }

        .dark ::-webkit-scrollbar-thumb {
            background: rgba(71, 85, 105, 0.5);
        }

        /* Print Specific Styles for Receipts */
        @media print {
            body * {
                visibility: hidden;
            }
            #invoiceModal, #invoiceModal * {
                visibility: visible;
            }
            #invoiceModal {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                background: white !important;
                color: black !important;
            }
            .modal-content {
                box-shadow: none !important;
                border: none !important;
            }
            button, .modal-backdrop, .bi-patch-check-fill, .animate-bounce {
                display: none !important;
            }
            .bg-slate-50, .dark\:bg-slate-950 {
                background: white !important;
                border: 1px solid #eee !important;
            }
            .text-indigo-600, .text-slate-900, .dark\:text-white {
                color: black !important;
            }
            #invoiceModal .modal-body {
                padding: 0 !important;
            }
            /* Reset dark mode for printing */
            .dark {
                background: white !important;
            }
        }
    </style>


</head>

<body
    class="bg-gradient-to-br from-slate-50 via-blue-50 to-purple-50 dark:from-slate-950 dark:via-slate-900 dark:to-slate-950 min-h-screen">


    <!-- App Layout -->
    <div class="flex h-screen overflow-hidden">

        <!-- Sidebar -->
        <aside class="w-64 glass-strong border-r border-slate-200/50 dark:border-slate-800/50 flex flex-col">
            <!-- Logo -->
            <div class="p-6 border-b border-slate-200/50 dark:border-slate-800/50">
                <a href="/" class="nav-logo group">
                    <div class="logo-icon group-hover:scale-110 transition-transform">📦</div>
                    <span
                        class="text-2xl font-display font-black bg-gradient-to-r from-primary-600 to-accent-600 bg-clip-text text-transparent">
                        INVPRO
                    </span>
                </a>
                <p id="ctx-chain-name"
                    class="text-xs text-slate-500 dark:text-slate-400 mt-2 font-black uppercase tracking-widest">
                    ...
                </p>
            </div>

            <!-- Navigation -->
            <nav id="sidebar-nav" class="flex-1 p-4 space-y-1 overflow-y-auto">
                <div class="animate-pulse space-y-4 opacity-20">
                    <div class="h-10 bg-slate-300 dark:bg-slate-700 rounded-xl"></div>
                    <div class="h-10 bg-slate-200 dark:bg-slate-800 rounded-xl"></div>
                    <div class="h-10 bg-slate-300 dark:bg-slate-700 rounded-xl"></div>
                </div>
            </nav>

            <!-- User Profile -->
            <div class="p-4 border-t border-slate-200/50 dark:border-slate-800/50">
                <div class="flex items-center gap-3 mb-3">
                    <div id="user-avatar"
                        class="w-10 h-10 rounded-full bg-gradient-to-br from-primary-500 to-accent-500 flex items-center justify-center text-white font-bold">
                        ?
                    </div>
                    <div class="flex-1 min-w-0">
                        <p id="ctx-username" class="text-sm font-bold text-slate-900 dark:text-white truncate">
                            Loading...</p>
                        <p id="ctx-role" class="text-xs text-slate-500 dark:text-slate-400 truncate">...</p>
                    </div>
                </div>
                <div class="flex gap-2">
                    <button onclick="toggleTheme()"
                        class="flex-1 px-3 py-2 text-xs font-bold rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">
                        <i class="bi bi-moon-stars-fill dark:hidden"></i>
                        <i class="bi bi-sun-fill hidden dark:inline"></i>
                    </button>
                    <a href="/auth/logout"
                        class="flex-1 px-3 py-2 text-xs font-bold rounded-lg bg-red-100 dark:bg-red-900/30 text-red-600 dark:text-red-400 hover:bg-red-200 dark:hover:bg-red-900/50 transition-colors text-center">
                        <i class="bi bi-box-arrow-right"></i>
                    </a>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto">
            <!-- Top Bar -->
            <header class="glass-strong sticky top-0 z-10 border-b border-slate-200/50 dark:border-slate-800/50">
                <div class="px-8 py-4 flex items-center justify-between">
                    <div>
                        <h2 class="text-xl font-display font-bold text-slate-900 dark:text-white">
                            Dashboard
                        </h2>
                        <p class="text-sm text-slate-500 dark:text-slate-400 mt-0.5">
                            Welcome back
                        </p>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="text-right">
                            <p id="ctx-store-label"
                                class="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">
                                Branch
                            </p>
                            <p id="ctx-store-name" class="text-sm font-bold text-slate-900 dark:text-white">...</p>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Page Content -->
            <div class="p-8">
                <!-- Flash Messages -->
                <div id="flash-container" class="mb-6 space-y-2 hidden"></div>

                <div id="app-dynamic-view">
                    <!-- Dynamic Page Content -->
                </div>
            </div>
        </main>
    </div>



    <!-- Global App Alert Modal -->
    <div class="modal fade" id="appAlertModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content border-0 shadow-2xl rounded-[2rem] dark:bg-slate-900 overflow-hidden">
                <div class="modal-body p-8 text-center">
                    <div id="appAlertIconContainer"
                        class="w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                        <i id="appAlertIcon" class="bi text-2xl"></i>
                    </div>
                    <h3 id="appAlertTitle"
                        class="text-lg font-black text-slate-900 dark:text-white uppercase tracking-tighter mb-2">Alert
                    </h3>
                    <p id="appAlertMessage" class="text-sm font-medium text-slate-500 dark:text-slate-400 mb-6 px-2">
                    </p>
                    <button type="button"
                        class="w-full py-3 bg-slate-900 dark:bg-white text-white dark:text-slate-900 rounded-xl font-black text-xs uppercase tracking-widest hover:scale-[1.02] active:scale-95 transition-all shadow-lg"
                        data-bs-dismiss="modal">
                        OK
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Global Alert Function
        function showAlert(message, type = 'warning', title = 'Attention') {
            const modalEl = document.getElementById('appAlertModal');
            const bsModal = new bootstrap.Modal(modalEl);
            const titleEl = document.getElementById('appAlertTitle');
            const msgEl = document.getElementById('appAlertMessage');
            const iconEl = document.getElementById('appAlertIcon');
            const iconContainer = document.getElementById('appAlertIconContainer');

            titleEl.textContent = title;
            msgEl.textContent = message;

            // Reset classes
            iconContainer.className = 'w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 ';

            if (type === 'error') {
                iconContainer.classList.add('bg-red-50', 'dark:bg-red-900/20', 'text-red-500');
                iconEl.className = 'bi bi-exclamation-octagon-fill text-2xl';
            } else if (type === 'success') {
                iconContainer.classList.add('bg-emerald-50', 'dark:bg-emerald-900/20', 'text-emerald-500');
                iconEl.className = 'bi bi-check-circle-fill text-2xl';
            } else { // warning
                iconContainer.classList.add('bg-amber-50', 'dark:bg-amber-900/20', 'text-amber-500');
                iconEl.className = 'bi bi-exclamation-triangle-fill text-2xl';
            }

            bsModal.show();
        }

        // Theme Toggle
        function toggleTheme() {
            const html = document.documentElement;
            const isDark = html.classList.contains('dark');

            if (isDark) {
                html.classList.remove('dark');
                html.classList.add('light');
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.remove('light');
                html.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
        }

        // Load theme on page load
        document.addEventListener('DOMContentLoaded', () => {
            const theme = localStorage.getItem('theme') || 'light';
            document.documentElement.classList.add(theme);
            loadSessionContext();
        });

        async function loadSessionContext() {
            try {
                const response = await fetch('/api/session-context');
                const ctx = await response.json();

                // Update UI metadata
                document.getElementById('ctx-chain-name').textContent = ctx.store_name || ctx.chain_name || 'INVPRO';
                document.getElementById('ctx-username').textContent = ctx.username;
                document.getElementById('ctx-role').textContent = ctx.role === 'business_admin' ? 'Head Office Admin' : (ctx.role === 'branch_admin' ? 'Manager' : 'Staff');
                document.getElementById('user-avatar').textContent = ctx.username[0].toUpperCase();
                document.getElementById('ctx-store-name').textContent = ctx.store_name || 'Head Office';
                document.getElementById('ctx-store-label').textContent = ctx.role === 'business_admin' ? 'Business HQ' : 'Shop';

                renderSidebar(ctx.role);
            } catch (e) {
                console.error("Context Load Failed:", e);
            }
        }

        function renderSidebar(role) {
            const nav = document.getElementById('sidebar-nav');
            const path = window.location.pathname;

            let menu = [];
            if (role === 'business_admin') {
                menu = [
                    { name: 'Home', icon: 'bi-grid-fill', url: '/' },
                    { name: 'Master Product List', icon: 'bi-box-seam-fill', url: '/inventory/global' },
                    { name: 'Product Categories', icon: 'bi-tags-fill', url: '/inventory/categories' },
                    { name: 'Shops & Branches', icon: 'bi-building', url: '/settings/' },
                    { name: 'Tax Rates', icon: 'bi-percent', url: '/settings/tax' },
                    { name: 'Staff Users', icon: 'bi-people-fill', url: '/users/' },
                    { name: 'Sales Reports', icon: 'bi-graph-up', url: '/sales/reports' },
                ];
            } else if (role === 'branch_admin') {
                menu = [
                    { name: 'Home', icon: 'bi-grid-fill', url: '/' },
                    { name: 'Shop Stock', icon: 'bi-box-seam', url: '/inventory/products' },
                    { name: 'Billing Counter', icon: 'bi-cart4', url: '/billing/' },
                    { name: 'My Team', icon: 'bi-people', url: '/users/' },
                    { name: 'Reports', icon: 'bi-graph-up', url: '/sales/reports' }
                ];
            } else {
                menu = [
                    { name: 'Billing Counter', icon: 'bi-cart4', url: '/billing/' },
                    { name: 'Check Stock', icon: 'bi-eye', url: '/inventory/products' }
                ];
            }

            nav.innerHTML = menu.map(item => {
                const isActive = (path === item.url) || (item.url === '/' && (path === '/dashboard' || path === '/store-dashboard')) || (item.url !== '/' && path.startsWith(item.url));
                return `
                    <a href="${item.url}" class="nav-item ${isActive ? 'active' : ''}">
                        <i class="bi ${item.icon}"></i>
                        <span>${item.name}</span>
                    </a>
                `;
            }).join('');
        }
    </script>

</body>

</html>
