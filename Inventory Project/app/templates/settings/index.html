<!DOCTYPE html>
<html lang="en" class="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Branch Management - INVPRO</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio&preflight=true"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: { 50: '#f0f9ff', 100: '#e0f2fe', 200: '#bae6fd', 300: '#7dd3fc', 400: '#38bdf8', 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1', 800: '#075985', 900: '#0c4a6e' },
                        accent: { 50: '#fdf4ff', 100: '#fae8ff', 200: '#f5d0fe', 300: '#f0abfc', 400: '#e879f9', 500: '#d946ef', 600: '#c026d3', 700: '#a21caf', 800: '#86198f', 900: '#701a75' }
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'], display: ['Outfit', 'Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <style>
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }

        .dark .glass {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-strong {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
        }

        .dark .glass-strong {
            background: rgba(15, 23, 42, 0.9);
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            font-size: 0.875rem;
            font-weight: 700;
            color: #475569;
            transition: all 0.2s;
            text-decoration: none;
        }

        .nav-item.active {
            background: linear-gradient(to right, #0ea5e9, #d946ef);
            color: white;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #0ea5e9 0%, #d946ef 100%);
            border-radius: 10px;
            display: grid;
            place-items: center;
            color: white;
            font-size: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .bento-card {
            background: white;
            border-radius: 1.5rem;
            border: 1px solid #f1f5f9;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .dark .bento-card {
            background: #0f172a;
            border-color: #1e293b;
        }

        .bento-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            background: white;
            border-color: rgba(14, 165, 233, 0.3);
        }

        .dark .bento-card:hover {
            background: #1e293b;
            border-color: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>

<body
    class="bg-gradient-to-br from-slate-50 via-blue-50 to-purple-50 dark:from-slate-950 dark:via-slate-900 dark:to-slate-950 min-h-screen">

    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-64 glass-strong border-r border-slate-200/50 dark:border-slate-800/50 flex flex-col">
            <div class="p-6 border-b border-slate-200/50 dark:border-slate-800/50">
                <a href="/" class="nav-logo group">
                    <div class="logo-icon group-hover:scale-110 transition-transform">📦</div>
                    <span
                        class="text-2xl font-black bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent"
                        style="font-family: 'Outfit';">INVPRO</span>
                </a>
                <p id="ctx-chain-name" class="text-[10px] text-slate-500 font-black uppercase tracking-widest mt-2">...
                </p>
            </div>
            <nav id="sidebar-nav" class="flex-1 p-4 space-y-1 overflow-y-auto">
                <!-- Nav Items injected via JS -->
            </nav>
            <div class="p-4 border-t border-slate-200/50 dark:border-slate-800/50">
                <div class="flex items-center gap-3 mb-3">
                    <div id="user-avatar"
                        class="w-10 h-10 rounded-full bg-gradient-to-br from-blue-500 to-purple-500 flex items-center justify-center text-white font-bold">
                        ?</div>
                    <div class="flex-1 min-w-0">
                        <p id="ctx-username" class="text-sm font-bold text-slate-900 dark:text-white truncate">
                            Loading...</p>
                        <p id="ctx-role" class="text-xs text-slate-500 truncate">...</p>
                    </div>
                </div>
                <div class="flex gap-2">
                    <button onclick="toggleTheme()"
                        class="flex-1 px-3 py-2 text-xs font-bold rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 transition-colors"><i
                            class="bi bi-moon-stars-fill dark:hidden"></i><i
                            class="bi bi-sun-fill hidden dark:inline text-white"></i></button>
                    <a href="/auth/logout"
                        class="flex-1 px-3 py-2 text-xs font-bold rounded-lg bg-red-100 dark:bg-red-900/30 text-red-600 dark:text-red-400 hover:bg-red-200 transition-colors text-center"><i
                            class="bi bi-box-arrow-right"></i></a>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto">
            <header
                class="glass-strong border-b border-slate-200/50 dark:border-slate-800/50 px-8 py-4 flex items-center justify-between sticky top-0 z-50">
                <div>
                    <h2 class="text-xl font-bold text-slate-900 dark:text-white" style="font-family: 'Outfit';">Branch
                        Management</h2>
                    <p class="text-sm text-slate-500">Manage all branches across your chain</p>
                </div>
                <div class="text-right">
                    <p id="ctx-store-label" class="text-[10px] font-black text-slate-400 uppercase tracking-widest">
                        Enterprise</p>
                    <p id="ctx-store-name" class="text-sm font-bold text-slate-900 dark:text-white">...</p>
                </div>
            </header>

            <div class="p-8 space-y-6">
                <!-- Action Bar -->
                <div
                    class="flex items-center justify-between bg-white dark:bg-slate-900 p-6 rounded-3xl border border-slate-100 dark:border-slate-800">
                    <div class="relative">
                        <input type="text" id="searchInput" placeholder="Search branches..."
                            class="w-80 pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm font-bold">
                        <i class="bi bi-search absolute left-3 top-3 text-slate-400"></i>
                    </div>
                    <button onclick="openAddModal()"
                        class="px-6 py-2.5 bg-indigo-600 text-white rounded-xl font-bold text-xs flex items-center gap-2 shadow-lg shadow-indigo-600/20"><i
                            class="bi bi-plus-circle-fill"></i> ADD BRANCH</button>
                </div>

                <!-- Stats -->
                <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                    <div class="bento-card p-6 flex items-center gap-4">
                        <div
                            class="w-12 h-12 bg-blue-100 text-blue-600 rounded-xl flex items-center justify-center text-xl">
                            <i class="bi bi-building"></i>
                        </div>
                        <div>
                            <p class="text-[10px] font-black text-slate-400 uppercase">Total Branches</p>
                            <h3 id="total-branches" class="text-2xl font-black">0</h3>
                        </div>
                    </div>
                    <div class="bento-card p-6 flex items-center gap-4">
                        <div
                            class="w-12 h-12 bg-green-100 text-green-600 rounded-xl flex items-center justify-center text-xl">
                            <i class="bi bi-check-circle-fill"></i>
                        </div>
                        <div>
                            <p class="text-[10px] font-black text-slate-400 uppercase">Active Nodes</p>
                            <h3 id="active-branches" class="text-2xl font-black">0</h3>
                        </div>
                    </div>
                    <div class="bento-card p-6 flex items-center gap-4">
                        <div
                            class="w-12 h-12 bg-purple-100 text-purple-600 rounded-xl flex items-center justify-center text-xl">
                            <i class="bi bi-people-fill"></i>
                        </div>
                        <div>
                            <p class="text-[10px] font-black text-slate-400 uppercase">Total Users</p>
                            <h3 id="total-users" class="text-2xl font-black">0</h3>
                        </div>
                    </div>
                    <div class="bento-card p-6 flex items-center gap-4">
                        <div
                            class="w-12 h-12 bg-orange-100 text-orange-600 rounded-xl flex items-center justify-center text-xl">
                            <i class="bi bi-box-seam"></i>
                        </div>
                        <div>
                            <p class="text-[10px] font-black text-slate-400 uppercase">Total Stock</p>
                            <h3 id="total-products" class="text-2xl font-black">0</h3>
                        </div>
                    </div>
                </div>

                <!-- Branches Grid -->
                <div id="branches-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
            </div>
        </main>
    </div>

    <!-- Branch Modal -->
    <div class="modal fade" id="branchModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-2xl rounded-3xl dark:bg-slate-900">
                <div class="bg-indigo-600 p-8 text-white rounded-t-3xl">
                    <h3 id="modal-title" class="text-2xl font-black">Add Branch</h3>
                    <p class="text-sm opacity-80">Configure new operational node</p>
                </div>
                <form id="branchForm" class="p-8 space-y-5">
                    <input type="hidden" id="branch-id">
                    <div><label
                            class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1 block">Branch
                            Name</label><input type="text" id="branch-name" required
                            class="w-full px-4 py-3 rounded-xl border bg-slate-50 dark:bg-slate-800 font-bold"></div>
                    <div><label
                            class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1 block">Location</label><input
                            type="text" id="branch-location"
                            class="w-full px-4 py-3 rounded-xl border bg-slate-50 dark:bg-slate-800 font-bold"></div>
                    <div class="flex gap-4 pt-4">
                        <button type="button" class="flex-1 py-3 font-bold text-slate-400"
                            data-bs-dismiss="modal">Cancel</button>
                        <button type="submit"
                            class="flex-[2] py-3 bg-indigo-600 text-white rounded-xl font-bold uppercase tracking-widest shadow-lg shadow-indigo-600/20">Provision
                            Branch</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Delete Modal -->
    <div class="modal fade" id="deleteBranchModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content border-0 shadow-2xl rounded-3xl dark:bg-slate-900 p-8 text-center">
                <div
                    class="w-16 h-16 bg-red-100 text-red-600 rounded-full flex items-center justify-center text-3xl mx-auto mb-4">
                    <i class="bi bi-trash"></i>
                </div>
                <h3 class="text-xl font-black">Delete Branch?</h3>
                <p class="text-xs text-slate-500 my-4">This will purge the branch and all associated stock links.</p>
                <div class="flex gap-3">
                    <button class="flex-1 py-2 text-xs font-bold" data-bs-dismiss="modal">Keep</button>
                    <button id="confirmDeleteBranchBtn"
                        class="flex-1 py-2 bg-red-600 text-white rounded-lg text-xs font-black uppercase">Terminate</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div id="toast-container" class="fixed bottom-8 right-8 z-[9999] flex flex-col gap-3"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // System JS
        function showToast(msg, isError = false) {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = `px-6 py-4 rounded-2xl shadow-2xl flex items-center gap-3 transform transition-all duration-500 translate-y-20 opacity-0 ${isError ? 'bg-red-600' : 'bg-slate-900'} text-white font-bold text-sm`;
            toast.innerHTML = `
                <i class="bi ${isError ? 'bi-exclamation-circle-fill' : 'bi-check-circle-fill'}"></i>
                <span>${msg}</span>
            `;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.remove('translate-y-20', 'opacity-0');
            }, 10);
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
                setTimeout(() => toast.remove(), 500);
            }, 3000);
        }

        function toggleTheme() {
            const html = document.documentElement;
            const isDark = html.classList.contains('dark');
            html.classList.remove(isDark ? 'dark' : 'light');
            html.classList.add(isDark ? 'light' : 'dark');
            localStorage.setItem('theme', isDark ? 'light' : 'dark');
        }

        let SESSION_DATA = {};
        async function loadSessionContext() {
            try {
                const res = await fetch('/api/session-context');
                const ctx = await res.json();
                SESSION_DATA = ctx;
                document.getElementById('ctx-chain-name').textContent = ctx.store_name || ctx.chain_name || 'INVPRO';
                document.getElementById('ctx-username').textContent = ctx.username;
                document.getElementById('ctx-role').textContent = ctx.role === 'business_admin' ? 'HQ Admin' : (ctx.role === 'branch_admin' ? 'Manager' : 'Staff');
                document.getElementById('user-avatar').textContent = ctx.username[0].toUpperCase();
                document.getElementById('ctx-store-name').textContent = ctx.store_name || 'HQ';
                renderSidebar(ctx.role);
                loadBranches();
            } catch (e) { console.error(e); }
        }

        function renderSidebar(role) {
            const nav = document.getElementById('sidebar-nav');
            const path = window.location.pathname;

            let menu = [];
            if (role === 'business_admin') {
                menu = [
                    { name: 'Home', icon: 'bi-grid-fill', url: '/' },
                    { name: 'Master Product List', icon: 'bi-box-seam-fill', url: '/inventory/global' },
                    { name: 'Product Categories', icon: 'bi-tags-fill', url: '/inventory/categories' },
                    { name: 'Shops & Branches', icon: 'bi-building', url: '/settings/' },
                    { name: 'Tax Rates', icon: 'bi-percent', url: '/settings/tax' },
                    { name: 'Staff Users', icon: 'bi-people-fill', url: '/users/' },
                    { name: 'Sales Reports', icon: 'bi-graph-up', url: '/sales/reports' },
                ];
            } else if (role === 'branch_admin') {
                menu = [
                    { name: 'Home', icon: 'bi-grid-fill', url: '/' },
                    { name: 'Shop Stock', icon: 'bi-box-seam', url: '/inventory/products' },
                    { name: 'Billing Counter', icon: 'bi-cart4', url: '/billing/' },
                    { name: 'My Team', icon: 'bi-people', url: '/users/' },
                    { name: 'Reports', icon: 'bi-graph-up', url: '/sales/reports' }
                ];
            } else {
                menu = [
                    { name: 'Billing Counter', icon: 'bi-cart4', url: '/billing/' },
                    { name: 'Check Stock', icon: 'bi-eye', url: '/inventory/products' }
                ];
            }

            nav.innerHTML = menu.map(item => {
                const isActive = (path === item.url) || (item.url === '/' && (path === '/dashboard' || path === '/store-dashboard'));
                return `
                    <a href="${item.url}" class="nav-item ${isActive ? 'active' : ''}">
                        <i class="bi ${item.icon}"></i>
                        <span>${item.name}</span>
                    </a>
                `;
            }).join('');
        }

        let branches = [];
        async function loadBranches() {
            const res = await fetch('/settings/api/branches');
            branches = await res.json();
            renderBranches();
            updateStats();
        }

        function renderBranches() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const grid = document.getElementById('branches-grid');
            grid.innerHTML = branches.filter(b => b.name.toLowerCase().includes(search)).map(b => `
                <div class="bento-card p-8 hover:scale-[1.02] transition-transform flex flex-col">
                    <div class="flex justify-between mb-6">
                        <div class="w-14 h-14 bg-indigo-600 text-white rounded-2xl flex items-center justify-center text-2xl shadow-lg shadow-indigo-600/20"><i class="bi bi-building"></i></div>
                    </div>
                    <h3 class="text-xl font-black mb-1">${b.name}</h3>
                    <p class="text-xs font-bold text-slate-400 flex items-center gap-2"><i class="bi bi-geo-alt"></i> ${b.location || 'No location set'}</p>
                    <div class="mt-6 pt-5 border-t border-slate-100 dark:border-slate-800 grid grid-cols-3 gap-4">
                        <div><p class="text-[9px] font-black text-slate-400 uppercase mb-1">Users</p><p class="text-lg font-black">${b.user_count || 0}</p></div>
                        <div><p class="text-[9px] font-black text-slate-400 uppercase mb-1">Products</p><p class="text-lg font-black">${b.product_count || 0}</p></div>
                        <div><p class="text-[9px] font-black text-slate-400 uppercase mb-1">Stock Vol</p><p class="text-lg font-black">${b.stock_volume || 0}</p></div>
                    </div>
                    <div class="mt-5 pt-4 border-t border-slate-100 dark:border-slate-800 flex gap-2">
                        <button onclick="editBranch(${b.id})" class="flex-1 flex items-center justify-center gap-2 py-2.5 text-xs font-bold text-indigo-600 bg-indigo-50 dark:bg-indigo-900/20 hover:bg-indigo-100 dark:hover:bg-indigo-900/40 rounded-xl transition-colors"><i class="bi bi-pencil-square"></i> Edit</button>
                        <button onclick="deleteBranch(${b.id})" class="flex-1 flex items-center justify-center gap-2 py-2.5 text-xs font-bold text-red-600 bg-red-50 dark:bg-red-900/20 hover:bg-red-100 dark:hover:bg-red-900/40 rounded-xl transition-colors"><i class="bi bi-trash3"></i> Delete</button>
                    </div>
                </div>
            `).join('');
        }

        function updateStats() {
            document.getElementById('total-branches').textContent = branches.length;
            document.getElementById('active-branches').textContent = branches.length;
            document.getElementById('total-users').textContent = branches.reduce((s, b) => s + (b.user_count || 0), 0);
            document.getElementById('total-products').textContent = branches.reduce((s, b) => s + (b.stock_volume || 0), 0);
        }

        function openAddModal() {
            document.getElementById('modal-title').textContent = 'Add Branch';
            document.getElementById('branchForm').reset();
            document.getElementById('branch-id').value = '';
            new bootstrap.Modal(document.getElementById('branchModal')).show();
        }

        function editBranch(id) {
            const b = branches.find(x => x.id === id);
            document.getElementById('modal-title').textContent = 'Edit Branch';
            document.getElementById('branch-id').value = b.id;
            document.getElementById('branch-name').value = b.name;
            document.getElementById('branch-location').value = b.location || '';
            new bootstrap.Modal(document.getElementById('branchModal')).show();
        }

        function deleteBranch(id) {
            window.branchToDelete = id;
            new bootstrap.Modal(document.getElementById('deleteBranchModal')).show();
        }

        document.getElementById('confirmDeleteBranchBtn').onclick = async () => {
            try {
                const res = await fetch(`/settings/api/branches/${window.branchToDelete}`, { method: 'DELETE' });
                const data = await res.json();
                if (res.ok) {
                    showToast('Branch decommissioned successfully.');
                    bootstrap.Modal.getInstance(document.getElementById('deleteBranchModal')).hide();
                    loadBranches();
                } else {
                    showToast(data.error || 'Failed to delete branch.', true);
                }
            } catch (err) {
                showToast('Network error. Please try again.', true);
            }
        }

        document.getElementById('branchForm').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('branch-id').value;
            const data = { name: document.getElementById('branch-name').value, location: document.getElementById('branch-location').value };
            try {
                const res = await fetch(id ? `/settings/api/branches/${id}` : '/settings/api/branches', {
                    method: id ? 'PUT' : 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                if (res.ok) {
                    showToast(id ? 'Branch details updated.' : 'New branch registered!');
                    bootstrap.Modal.getInstance(document.getElementById('branchModal')).hide();
                    loadBranches();
                } else {
                    showToast(result.error || 'Operation failed.', true);
                }
            } catch (err) {
                showToast('Connection error.', true);
            }
        }

        document.getElementById('searchInput').addEventListener('input', renderBranches);
        document.addEventListener('DOMContentLoaded', () => {
            const theme = localStorage.getItem('theme') || 'light';
            document.documentElement.classList.add(theme);
            loadSessionContext();
        });
    </script>
</body>

</html>
