<!DOCTYPE html>
<html lang="en" class="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category Management - INVPRO</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio&preflight=true"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: { 50: '#f0f9ff', 100: '#e0f2fe', 200: '#bae6fd', 300: '#7dd3fc', 400: '#38bdf8', 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1', 800: '#075985', 900: '#0c4a6e' },
                        accent: { 50: '#fdf4ff', 100: '#fae8ff', 200: '#f5d0fe', 300: '#f0abfc', 400: '#e879f9', 500: '#d946ef', 600: '#c026d3', 700: '#a21caf', 800: '#86198f', 900: '#701a75' }
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'], display: ['Outfit', 'Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <style>
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }

        .dark .glass {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-strong {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
        }

        .dark .glass-strong {
            background: rgba(15, 23, 42, 0.9);
        }

        .bento-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 1.5rem;
            padding: 1.5rem;
            transition: all 0.3s;
        }

        .dark .bento-card {
            background: rgba(15, 23, 42, 0.7);
            border-color: rgba(255, 255, 255, 0.08);
        }

        .bento-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            background: white;
            border-color: rgba(14, 165, 233, 0.3);
        }

        .dark .bento-card:hover {
            background: #1e293b;
            border-color: rgba(255, 255, 255, 0.2);
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            font-size: 0.875rem;
            font-weight: 700;
            color: #475569;
            transition: all 0.2s;
            text-decoration: none;
        }

        .nav-item.active {
            background: linear-gradient(to right, #0ea5e9, #d946ef);
            color: white;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #0ea5e9 0%, #d946ef 100%);
            border-radius: 10px;
            display: grid;
            place-items: center;
            color: white;
            font-size: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body
    class="bg-gradient-to-br from-slate-50 via-blue-50 to-purple-50 dark:from-slate-950 dark:via-slate-900 dark:to-slate-950 min-h-screen">

    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-64 glass-strong border-r border-slate-200/50 dark:border-slate-800/50 flex flex-col">
            <div class="p-6 border-b border-slate-200/50 dark:border-slate-800/50">
                <a href="/" class="nav-logo group">
                    <div class="logo-icon group-hover:scale-110 transition-transform">📦</div>
                    <span
                        class="text-2xl font-black bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent"
                        style="font-family: 'Outfit';">INVPRO</span>
                </a>
                <p id="ctx-chain-name" class="text-[10px] text-slate-500 font-black uppercase tracking-widest mt-2">...
                </p>
            </div>
            <nav id="sidebar-nav" class="flex-1 p-4 space-y-1 overflow-y-auto">
                <!-- Nav Items injected via JS -->
            </nav>
            <div class="p-4 border-t border-slate-200/50 dark:border-slate-800/50">
                <div class="flex items-center gap-3 mb-3">
                    <div id="user-avatar"
                        class="w-10 h-10 rounded-full bg-gradient-to-br from-blue-500 to-purple-500 flex items-center justify-center text-white font-bold">
                        ?</div>
                    <div class="flex-1 min-w-0">
                        <p id="ctx-username" class="text-sm font-bold text-slate-900 dark:text-white truncate">
                            Loading...</p>
                        <p id="ctx-role" class="text-xs text-slate-500 truncate">...</p>
                    </div>
                </div>
                <div class="flex gap-2">
                    <button onclick="toggleTheme()"
                        class="flex-1 px-3 py-2 text-xs font-bold rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 transition-colors"><i
                            class="bi bi-moon-stars-fill dark:hidden"></i><i
                            class="bi bi-sun-fill hidden dark:inline text-white"></i></button>
                    <a href="/auth/logout"
                        class="flex-1 px-3 py-2 text-xs font-bold rounded-lg bg-red-100 dark:bg-red-900/30 text-red-600 dark:text-red-400 hover:bg-red-200 transition-colors text-center"><i
                            class="bi bi-box-arrow-right"></i></a>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto">
            <header
                class="glass-strong border-b border-slate-200/50 dark:border-slate-800/50 px-8 py-4 flex items-center justify-between sticky top-0 z-50">
                <div>
                    <h2 class="text-xl font-bold text-slate-900 dark:text-white" style="font-family: 'Outfit';">Category
                        Registry</h2>
                    <p class="text-sm text-slate-500">Organize your product catalog</p>
                </div>
                <div class="text-right">
                    <p id="ctx-store-label" class="text-[10px] font-black text-slate-400 uppercase tracking-widest">
                        Enterprise</p>
                    <p id="ctx-store-name" class="text-sm font-bold text-slate-900 dark:text-white">...</p>
                </div>
            </header>

            <div class="p-8 space-y-6">
                <!-- Action Bar -->
                <div class="flex items-center justify-between">
                    <div class="relative">
                        <input type="text" id="searchInput" placeholder="Search categories..."
                            class="w-80 pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 bg-white text-sm font-medium focus:ring-2 focus:ring-purple-500 transition-all">
                        <i class="bi bi-search absolute left-3 top-3 text-slate-400"></i>
                    </div>
                    <button onclick="openAddModal()"
                        class="px-6 py-2.5 bg-slate-900 dark:bg-white text-white dark:text-slate-900 rounded-xl font-bold text-sm flex items-center gap-2"><i
                            class="bi bi-plus-circle-fill"></i> Add Category</button>
                </div>

                <!-- Stats -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="bento-card">
                        <div class="flex items-center gap-4">
                            <div
                                class="w-12 h-12 rounded-2xl bg-gradient-to-br from-purple-500 to-pink-600 flex items-center justify-center text-white text-xl">
                                <i class="bi bi-tags-fill"></i>
                            </div>
                            <div>
                                <p class="text-xs font-bold text-slate-500 uppercase tracking-wider">Total Categories
                                </p>
                                <p class="text-2xl font-black text-slate-900 dark:text-white" id="total-categories">0
                                </p>
                            </div>
                        </div>
                    </div>
                    <div class="bento-card">
                        <div class="flex items-center gap-4">
                            <div
                                class="w-12 h-12 rounded-2xl bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center text-white text-xl">
                                <i class="bi bi-box-seam-fill"></i>
                            </div>
                            <div>
                                <p class="text-xs font-bold text-slate-500 uppercase tracking-wider">Products</p>
                                <p class="text-2xl font-black text-slate-900 dark:text-white" id="total-products">0</p>
                            </div>
                        </div>
                    </div>
                    <div class="bento-card">
                        <div class="flex items-center gap-4">
                            <div
                                class="w-12 h-12 rounded-2xl bg-gradient-to-br from-green-500 to-emerald-600 flex items-center justify-center text-white text-xl">
                                <i class="bi bi-percent"></i>
                            </div>
                            <div>
                                <p class="text-xs font-bold text-slate-500 uppercase tracking-wider">Tax Policies</p>
                                <p class="text-2xl font-black text-slate-900 dark:text-white" id="total-taxes">0</p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6" id="categories-grid">
                </div>
            </div>
        </main>
    </div>

    <!-- Modals -->
    <div class="modal fade" id="categoryModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-2xl rounded-3xl overflow-hidden dark:bg-slate-900">
                <div class="bg-purple-600 p-8 text-white">
                    <h5 class="text-2xl font-black" id="modal-title">Add Category</h5>
                </div>
                <form id="categoryForm" class="p-8 space-y-6">
                    <input type="hidden" id="category-id">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Category Name</label>
                        <input type="text" id="category-name" required
                            class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800">
                    </div>
                    <div class="flex gap-4">
                        <button type="button" class="flex-1 py-3 font-bold text-slate-400"
                            data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="flex-[2] py-3 bg-purple-600 text-white rounded-xl font-bold">Save
                            Category</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // System JS
        function toggleTheme() {
            const html = document.documentElement;
            const isDark = html.classList.contains('dark');
            html.classList.remove(isDark ? 'dark' : 'light');
            html.classList.add(isDark ? 'light' : 'dark');
            localStorage.setItem('theme', isDark ? 'light' : 'dark');
        }

        let SESSION_DATA = {};
        async function loadSessionContext() {
            try {
                const res = await fetch('/api/session-context');
                const ctx = await res.json();
                SESSION_DATA = ctx;
                document.getElementById('ctx-chain-name').textContent = ctx.store_name || ctx.chain_name || 'INVPRO';
                document.getElementById('ctx-username').textContent = ctx.username;
                document.getElementById('ctx-role').textContent = ctx.role === 'business_admin' ? 'HQ Admin' : ctx.role === 'branch_admin' ? 'Manager' : 'Staff';
                document.getElementById('user-avatar').textContent = ctx.username[0].toUpperCase();
                document.getElementById('ctx-store-name').textContent = ctx.store_name || 'HQ';
                renderSidebar(ctx.role);
            } catch (e) { console.error(e); }
        }

        function renderSidebar(role) {
            const nav = document.getElementById('sidebar-nav');
            const path = window.location.pathname;

            let menu = [];
            if (role === 'business_admin') {
                menu = [
                    { name: 'Home', icon: 'bi-grid-fill', url: '/' },
                    { name: 'Master Product List', icon: 'bi-box-seam-fill', url: '/inventory/global' },
                    { name: 'Product Categories', icon: 'bi-tags-fill', url: '/inventory/categories' },
                    { name: 'Shops & Branches', icon: 'bi-building', url: '/settings/' },
                    { name: 'Tax Rates', icon: 'bi-percent', url: '/settings/tax' },
                    { name: 'Staff Users', icon: 'bi-people-fill', url: '/users/' },
                    { name: 'Sales Reports', icon: 'bi-graph-up', url: '/sales/reports' },
                ];
            } else if (role === 'branch_admin') {
                menu = [
                    { name: 'Home', icon: 'bi-grid-fill', url: '/' },
                    { name: 'Shop Stock', icon: 'bi-box-seam', url: '/inventory/products' },
                    { name: 'Billing Counter', icon: 'bi-cart4', url: '/billing/' },
                    { name: 'My Team', icon: 'bi-people', url: '/users/' },
                    { name: 'Reports', icon: 'bi-graph-up', url: '/sales/reports' }
                ];
            } else {
                menu = [
                    { name: 'Billing Counter', icon: 'bi-cart4', url: '/billing/' },
                    { name: 'Check Stock', icon: 'bi-eye', url: '/inventory/products' }
                ];
            }

            nav.innerHTML = menu.map(item => `
                <a href="${item.url}" class="nav-item ${path === item.url ? 'active' : ''}">
                    <i class="bi ${item.icon}"></i>
                    <span>${item.name}</span>
                </a>
            `).join('');
        }

        let categories = [];
        async function loadCategories() {
            const res = await fetch('/inventory/api/categories');
            categories = await res.json();
            renderCategories();
            document.getElementById('total-categories').textContent = categories.length;
            document.getElementById('total-products').textContent = categories.reduce((s, c) => s + (c.product_count || 0), 0);
            document.getElementById('total-taxes').textContent = categories.reduce((s, c) => s + (c.tax_count || 0), 0);
        }

        function renderCategories() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const grid = document.getElementById('categories-grid');
            grid.innerHTML = categories.filter(c => c.name.toLowerCase().includes(search)).map(c => `
                <div class="bento-card shadow-lg">
                    <div class="flex justify-between mb-4">
                        <div class="w-12 h-12 bg-purple-600 text-white rounded-xl flex items-center justify-center"><i class="bi bi-tag-fill text-xl"></i></div>
                        <div class="flex gap-2"><button onclick="editCategory(${c.id})" class="text-blue-600"><i class="bi bi-pencil"></i></button><button onclick="deleteCategory(${c.id})" class="text-red-600"><i class="bi bi-trash"></i></button></div>
                    </div>
                    <h3 class="text-xl font-black mb-2">${c.name}</h3>
                    <p class="text-sm opacity-60">${c.product_count || 0} Products</p>
                </div>
            `).join('') || '<div class="col-span-full text-center opacity-50 py-12">No categories found</div>';
        }

        function openAddModal() {
            document.getElementById('modal-title').textContent = 'Add Category';
            document.getElementById('categoryForm').reset();
            document.getElementById('category-id').value = '';
            new bootstrap.Modal(document.getElementById('categoryModal')).show();
        }

        function editCategory(id) {
            const c = categories.find(cat => cat.id === id);
            document.getElementById('modal-title').textContent = 'Edit Category';
            document.getElementById('category-id').value = c.id;
            document.getElementById('category-name').value = c.name;
            new bootstrap.Modal(document.getElementById('categoryModal')).show();
        }

        async function deleteCategory(id) {
            if (!confirm('Delete this category?')) return;
            await fetch(`/inventory/categories/delete/${id}`, { method: 'POST' });
            loadCategories();
        }

        document.getElementById('categoryForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('category-id').value;
            const data = { name: document.getElementById('category-name').value };
            const method = id ? 'PUT' : 'POST';
            const url = id ? `/settings/api/categories/${id}` : '/settings/api/categories';
            await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
            bootstrap.Modal.getInstance(document.getElementById('categoryModal')).hide();
            loadCategories();
        });

        document.getElementById('searchInput').addEventListener('input', renderCategories);
        document.addEventListener('DOMContentLoaded', () => {
            const theme = localStorage.getItem('theme') || 'light';
            document.documentElement.classList.add(theme);
            loadSessionContext();
            loadCategories();
        });
    </script>
</body>

</html>
