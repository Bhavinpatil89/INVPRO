<!DOCTYPE html>
<html lang="en" class="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Import Products - INVPRO</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio&preflight=true"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: { 50: '#f0f9ff', 100: '#e0f2fe', 200: '#bae6fd', 300: '#7dd3fc', 400: '#38bdf8', 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1', 800: '#075985', 900: '#0c4a6e' },
                        accent: { 50: '#fdf4ff', 100: '#fae8ff', 200: '#f5d0fe', 300: '#f0abfc', 400: '#e879f9', 500: '#d946ef', 600: '#c026d3', 700: '#a21caf', 800: '#86198f', 900: '#701a75' }
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'], display: ['Outfit', 'Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <style>
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }

        .dark .glass {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-strong {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
        }

        .dark .glass-strong {
            background: rgba(15, 23, 42, 0.9);
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            font-size: 0.875rem;
            font-weight: 700;
            color: #475569;
            transition: all 0.2s;
            text-decoration: none;
        }

        .nav-item.active {
            background: linear-gradient(to right, #0ea5e9, #d946ef);
            color: white;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .bento-card {
            background: white;
            border-radius: 1.5rem;
            border: 1px solid #f1f5f9;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .dark .bento-card {
            background: #0f172a;
            border-color: #1e293b;
        }
    </style>
</head>

<body
    class="bg-gradient-to-br from-slate-50 via-blue-50 to-purple-50 dark:from-slate-950 dark:via-slate-900 dark:to-slate-950 min-h-screen">

    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-64 glass-strong border-r border-slate-200/50 dark:border-slate-800/50 flex flex-col">
            <div class="p-6 border-b border-slate-200/50 dark:border-slate-800/50">
                <h1 class="text-2xl font-black bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent"
                    style="font-family: 'Outfit';">INVPRO</h1>
                <p id="ctx-chain-name" class="text-[10px] text-slate-500 font-black uppercase tracking-widest mt-1">...
                </p>
            </div>
            <nav id="sidebar-nav" class="flex-1 p-4 space-y-1 overflow-y-auto">
                <!-- Nav Items injected via JS -->
            </nav>
            <div class="p-4 border-t border-slate-200/50 dark:border-slate-800/50">
                <div class="flex items-center gap-3 mb-3">
                    <div id="user-avatar"
                        class="w-10 h-10 rounded-full bg-gradient-to-br from-blue-500 to-purple-500 flex items-center justify-center text-white font-bold">
                        ?</div>
                    <div class="flex-1 min-w-0">
                        <p id="ctx-username" class="text-sm font-bold text-slate-900 dark:text-white truncate">
                            Loading...</p>
                        <p id="ctx-role" class="text-xs text-slate-500 truncate">...</p>
                    </div>
                </div>
                <div class="flex gap-2">
                    <button onclick="toggleTheme()"
                        class="flex-1 px-3 py-2 text-xs font-bold rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 transition-colors"><i
                            class="bi bi-moon-stars-fill dark:hidden"></i><i
                            class="bi bi-sun-fill hidden dark:inline text-white"></i></button>
                    <a href="/auth/logout"
                        class="flex-1 px-3 py-2 text-xs font-bold rounded-lg bg-red-100 dark:bg-red-900/30 text-red-600 dark:text-red-400 hover:bg-red-200 transition-colors text-center"><i
                            class="bi bi-box-arrow-right"></i></a>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto">
            <header
                class="glass-strong border-b border-slate-200/50 dark:border-slate-800/50 px-8 py-4 flex items-center justify-between sticky top-0 z-50">
                <div>
                    <h2 class="text-xl font-bold text-slate-900 dark:text-white" style="font-family: 'Outfit';">Add
                        Products from Master</h2>
                    <p class="text-sm text-slate-500">Pick items from the Master List to add to your shop</p>
                </div>
                <div class="text-right">
                    <p id="ctx-store-label" class="text-[10px] font-black text-slate-400 uppercase tracking-widest">
                        Shop</p>
                    <p id="ctx-store-name" class="text-sm font-bold text-slate-900 dark:text-white">...</p>
                </div>
            </header>

            <div class="p-8 space-y-6">
                <!-- Action Bar -->
                <div
                    class="flex items-center justify-between bg-white dark:bg-slate-900 p-6 rounded-3xl border border-slate-100 dark:border-slate-800">
                    <div class="flex items-center gap-3">
                        <div class="relative">
                            <input type="text" id="searchInput" placeholder="Search registry..."
                                class="w-80 pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm font-bold">
                            <i class="bi bi-search absolute left-3 top-3 text-slate-400"></i>
                        </div>
                        <select id="categoryFilter"
                            class="px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-xs font-bold uppercase">
                            <option value="">All Categories</option>
                        </select>
                    </div>
                    <div class="flex items-center gap-4">
                        <span class="text-sm font-bold text-slate-500"><span id="selected-count"
                                class="text-indigo-600">0</span> selected</span>
                        <button onclick="importSelected()" id="import-btn" disabled
                            class="px-6 py-2.5 bg-indigo-600 text-white rounded-xl font-bold text-xs opacity-50 cursor-not-allowed transition-all">IMPORT
                            ASSETS</button>
                    </div>
                </div>

                <!-- Products Grid -->
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6" id="products-grid">
                </div>
            </div>
        </main>
    </div>

    <!-- Import Modal -->
    <div class="modal fade" id="importModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content border-0 shadow-2xl rounded-3xl dark:bg-slate-900">
                <div class="bg-indigo-600 p-8 text-white rounded-t-3xl">
                    <h3 class="text-2xl font-black">Configure Import</h3>
                    <p class="text-sm opacity-80">Set localized prices and starting stock</p>
                </div>
                <div class="p-8">
                    <div id="import-products-list" class="space-y-4 max-h-[400px] overflow-y-auto mb-8"></div>
                    <div class="flex gap-4">
                        <button type="button" class="flex-1 py-3 font-bold text-slate-400"
                            data-bs-dismiss="modal">Cancel</button>
                        <button onclick="confirmImport()"
                            class="flex-[2] py-3 bg-indigo-600 text-white rounded-xl font-bold uppercase tracking-widest">Execute
                            Import</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // System JS
        function toggleTheme() {
            const html = document.documentElement;
            const isDark = html.classList.contains('dark');
            html.classList.remove(isDark ? 'dark' : 'light');
            html.classList.add(isDark ? 'light' : 'dark');
            localStorage.setItem('theme', isDark ? 'light' : 'dark');
        }

        async function loadSessionContext() {
            try {
                const res = await fetch('/api/session-context');
                const ctx = await res.json();
                document.getElementById('ctx-chain-name').textContent = ctx.store_name || ctx.chain_name || 'INVPRO';
                document.getElementById('ctx-username').textContent = ctx.username;
                document.getElementById('ctx-role').textContent = ctx.role === 'business_admin' ? 'HQ Admin' : (ctx.role === 'branch_admin' ? 'Manager' : 'Staff');
                document.getElementById('user-avatar').textContent = ctx.username[0].toUpperCase();
                document.getElementById('ctx-store-name').textContent = ctx.store_name || 'HQ';
                renderSidebar(ctx.role);
                loadData();
            } catch (e) { console.error(e); }
        }

        function renderSidebar(role) {
            const nav = document.getElementById('sidebar-nav');
            const path = window.location.pathname;

            let menu = [];
            if (role === 'business_admin') {
                menu = [
                    { name: 'Home', icon: 'bi-grid-fill', url: '/' },
                    { name: 'Master Product List', icon: 'bi-box-seam-fill', url: '/inventory/global' },
                    { name: 'Product Categories', icon: 'bi-tags-fill', url: '/inventory/categories' },
                    { name: 'Shops & Branches', icon: 'bi-building', url: '/settings/' },
                    { name: 'Tax Rates', icon: 'bi-percent', url: '/settings/tax' },
                    { name: 'Staff Users', icon: 'bi-people-fill', url: '/users/' },
                    { name: 'Sales Reports', icon: 'bi-graph-up', url: '/sales/reports' },
                ];
            } else if (role === 'branch_admin') {
                menu = [
                    { name: 'Home', icon: 'bi-grid-fill', url: '/' },
                    { name: 'Shop Stock', icon: 'bi-box-seam', url: '/inventory/products' },
                    { name: 'Billing Counter', icon: 'bi-cart4', url: '/billing/' },
                    { name: 'My Team', icon: 'bi-people', url: '/users/' },
                    { name: 'Reports', icon: 'bi-graph-up', url: '/sales/reports' }
                ];
            } else {
                menu = [
                    { name: 'Billing Counter', icon: 'bi-cart4', url: '/billing/' },
                    { name: 'Check Stock', icon: 'bi-eye', url: '/inventory/products' }
                ];
            }

            nav.innerHTML = menu.map(item => `
                <a href="${item.url}" class="nav-item ${path === item.url ? 'active' : ''}">
                    <i class="bi ${item.icon}"></i>
                    <span>${item.name}</span>
                </a>
            `).join('');
        }

        let globalProducts = [], importedProducts = [], categories = [], selectedProducts = new Set();

        async function loadData() {
            const [p, c, i] = await Promise.all([
                fetch('/inventory/api/global-products').then(r => r.json()),
                fetch('/inventory/api/categories').then(r => r.json()),
                fetch('/inventory/api/products').then(r => r.json())
            ]);
            globalProducts = p; categories = c; importedProducts = i;
            const catFilter = document.getElementById('categoryFilter');
            categories.forEach(cat => catFilter.innerHTML += `<option value="${cat.id}">${cat.name}</option>`);
            renderProducts();
        }

        function renderProducts() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const cat = document.getElementById('categoryFilter').value;
            const grid = document.getElementById('products-grid');

            grid.innerHTML = globalProducts.filter(p => p.name.toLowerCase().includes(search) && (!cat || p.category_id == cat)).map(p => {
                const isImported = importedProducts.some(ip => ip.global_product_id === p.id);
                return `
                <div class="bento-card p-6 ${isImported ? 'opacity-50 grayscale' : ''}">
                    <div class="flex justify-between mb-4">
                        <div class="w-12 h-12 bg-indigo-600 text-white rounded-xl flex items-center justify-center"><i class="bi bi-box-seam"></i></div>
                        ${isImported ? '<span class="text-[10px] font-black text-green-600 uppercase">Imported</span>' : `<input type="checkbox" onchange="toggleProduct(${p.id})" class="w-5 h-5 rounded border-slate-300">`}
                    </div>
                    <h3 class="font-black text-lg mb-1">${p.name}</h3>
                    <p class="text-xs font-bold text-slate-400 mb-4">${p.category_name}</p>
                    <div class="flex justify-between border-t pt-4">
                        <div><p class="text-[9px] font-black text-slate-400 uppercase">HQ Cost</p><p class="text-sm font-black">₹${p.default_cost_price}</p></div>
                        <div class="text-right"><p class="text-[9px] font-black text-slate-400 uppercase">HQ Sell</p><p class="text-sm font-black">₹${p.default_selling_price}</p></div>
                    </div>
                </div>`;
            }).join('');
        }

        function toggleProduct(id) {
            if (selectedProducts.has(id)) selectedProducts.delete(id); else selectedProducts.add(id);
            document.getElementById('selected-count').textContent = selectedProducts.size;
            const btn = document.getElementById('import-btn');
            btn.disabled = selectedProducts.size === 0;
            btn.classList.toggle('opacity-50', selectedProducts.size === 0);
            btn.classList.toggle('cursor-not-allowed', selectedProducts.size === 0);
        }

        function importSelected() {
            const list = document.getElementById('import-products-list');
            list.innerHTML = globalProducts.filter(p => selectedProducts.has(p.id)).map(p => `
                <div class="p-4 rounded-xl bg-slate-50 dark:bg-slate-800 border-l-4 border-indigo-600 space-y-3">
                    <div class="flex justify-between"><h4 class="font-black">${p.name}</h4><span class="text-[10px] font-black text-slate-400">${p.category_name}</span></div>
                    <div class="grid grid-cols-3 gap-3">
                        <input type="number" id="cost-${p.id}" placeholder="Cost (₹${p.default_cost_price})" class="px-4 py-2 rounded-lg border text-sm font-bold bg-white">
                        <input type="number" id="sell-${p.id}" placeholder="Sell (₹${p.default_selling_price})" class="px-4 py-2 rounded-lg border text-sm font-bold bg-white">
                        <input type="number" id="qty-${p.id}" placeholder="Initial Stock" class="px-4 py-2 rounded-lg border text-sm font-bold bg-white">
                    </div>
                </div>`).join('');
            new bootstrap.Modal(document.getElementById('importModal')).show();
        }

        async function confirmImport() {
            const imports = globalProducts.filter(p => selectedProducts.has(p.id)).map(p => ({
                global_product_id: p.id, name: p.name, category_id: p.category_id,
                cost_price: document.getElementById(`cost-${p.id}`).value || p.default_cost_price,
                selling_price: document.getElementById(`sell-${p.id}`).value || p.default_selling_price,
                quantity: document.getElementById(`qty-${p.id}`).value || 0
            }));
            await fetch('/inventory/api/import-products', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ products: imports }) });
            location.reload();
        }

        document.getElementById('searchInput').addEventListener('input', renderProducts);
        document.getElementById('categoryFilter').addEventListener('change', renderProducts);
        document.addEventListener('DOMContentLoaded', () => {
            const theme = localStorage.getItem('theme') || 'light';
            document.documentElement.classList.add(theme);
            loadSessionContext();
        });
    </script>
</body>

</html>
