<!DOCTYPE html>
<html lang="en" class="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Establish Connection - INVPRO</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio&preflight=true"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: { 50: '#f0f9ff', 100: '#e0f2fe', 200: '#bae6fd', 300: '#7dd3fc', 400: '#38bdf8', 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1', 800: '#075985', 900: '#0c4a6e' },
                        accent: { 50: '#fdf4ff', 100: '#fae8ff', 200: '#f5d0fe', 300: '#f0abfc', 400: '#e879f9', 500: '#d946ef', 600: '#c026d3', 700: '#a21caf', 800: '#86198f', 900: '#701a75' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }

        .dark .glass {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .nav-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #0ea5e9 0%, #d946ef 100%);
            border-radius: 12px;
            display: grid;
            place-items: center;
            color: white;
            font-size: 24px;
            box-shadow: 0 10px 15px -3px rgba(14, 165, 233, 0.2);
        }
    </style>
</head>

<body
    class="bg-gradient-to-br from-slate-50 via-blue-50 to-purple-50 dark:from-slate-950 dark:via-slate-900 dark:to-slate-950 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-[440px] w-full">
        <!-- Brand Header -->
        <div class="text-center mb-8">
            <a href="/" class="nav-logo group inline-flex mb-6">
                <div class="logo-icon group-hover:scale-110 transition-transform">📦</div>
                <h1
                    class="text-4xl font-black bg-gradient-to-r from-primary-600 to-accent-600 bg-clip-text text-transparent tracking-tighter uppercase">
                    INVPRO</h1>
            </a>
            <p class="text-slate-500 dark:text-slate-400 font-bold text-[10px] uppercase tracking-[0.3em]">
                Business Management Access</p>
        </div>

        <!-- Auth Card -->
        <div class="glass p-10 rounded-[2.5rem] shadow-2xl">
            <!-- Alert Container -->
            <div id="alert-container" class="mb-6 hidden"></div>

            <form id="loginForm" class="space-y-6">
                <div>
                    <label
                        class="text-[10px] font-black text-slate-400 uppercase tracking-widest px-1 mb-2 block">Username</label>
                    <div class="relative group">
                        <i
                            class="bi bi-person absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 transition-colors group-focus-within:text-primary-500"></i>
                        <input type="text" name="username" id="username" required placeholder="Enter username"
                            class="w-full pl-11 pr-4 py-4 bg-slate-50/50 dark:bg-slate-950/50 border border-slate-200 dark:border-slate-800 rounded-2xl text-sm focus:ring-2 focus:ring-primary-500/20 font-medium transition-all outline-none text-slate-900 dark:text-white">
                    </div>
                </div>

                <div>
                    <label
                        class="text-[10px] font-black text-slate-400 uppercase tracking-widest px-1 mb-2 block">Password</label>
                    <div class="relative group">
                        <i
                            class="bi bi-key absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 transition-colors group-focus-within:text-primary-500"></i>
                        <input type="password" name="password" id="password" required placeholder="Enter password"
                            class="w-full pl-11 pr-4 py-4 bg-slate-50/50 dark:bg-slate-950/50 border border-slate-200 dark:border-slate-800 rounded-2xl text-sm focus:ring-2 focus:ring-primary-500/20 font-medium transition-all outline-none text-slate-900 dark:text-white">
                    </div>
                </div>

                <button type="submit" id="submitBtn"
                    class="w-full py-4 bg-gradient-to-r from-primary-600 to-accent-600 text-white rounded-2xl font-black text-xs uppercase tracking-widest shadow-xl shadow-primary-500/20 hover:shadow-primary-500/40 transition-all flex items-center justify-center gap-2">
                    <span>Login</span>
                    <i class="bi bi-arrow-right"></i>
                </button>
            </form>

            <div class="mt-8 pt-8 border-t border-slate-200/50 dark:border-slate-800/50 text-center space-y-4">
                <p class="text-xs font-bold text-slate-400 uppercase tracking-widest">New? <a href="/auth/register"
                        class="text-primary-600 hover:text-accent-600 ml-1">Setup Your Shop</a>
                </p>
                <a href="/auth/login"
                    class="block text-[9px] font-bold text-slate-400 hover:text-indigo-500 transition-colors uppercase tracking-[0.2em]">Refresh
                    Page</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const alert = document.getElementById('alert-container');

            btn.disabled = true;
            btn.innerHTML = '<i class="bi bi-arrow-repeat animate-spin"></i> SYNCING...';
            alert.classList.add('hidden');

            const formData = new FormData(e.target);
            try {
                const res = await fetch('/auth/login', {
                    method: 'POST',
                    body: formData,
                    headers: { 'Accept': 'application/json' }
                });
                const data = await res.json();

                if (data.success) {
                    window.location.href = data.redirect || '/';
                } else {
                    alert.innerHTML = `
                        <div class="p-4 rounded-2xl text-[10px] font-black uppercase tracking-widest flex items-center gap-3 shadow-sm bg-red-50 text-red-600 border border-red-100">
                            <i class="bi bi-exclamation-triangle-fill"></i>
                            ${data.message}
                        </div>`;
                    alert.classList.remove('hidden');
                    btn.disabled = false;
                    btn.innerHTML = '<span>Establish Connection</span><i class="bi bi-arrow-right"></i>';
                }
            } catch (err) {
                alert.innerHTML = `
                    <div class="p-4 rounded-2xl text-[10px] font-black uppercase tracking-widest flex items-center gap-3 shadow-sm bg-red-50 text-red-600 border border-red-100">
                        <i class="bi bi-exclamation-triangle-fill"></i>
                        Connection Synchronicity Failed
                    </div>`;
                alert.classList.remove('hidden');
                btn.disabled = false;
                btn.innerHTML = '<span>Establish Connection</span><i class="bi bi-arrow-right"></i>';
            }
        };

        // Theme sync
        const theme = localStorage.getItem('theme') || 'light';
        document.documentElement.classList.add(theme);
    </script>
</body>

</html>
