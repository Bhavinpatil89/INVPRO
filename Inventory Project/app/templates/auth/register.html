<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Setup Business — InvPro</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1e40af;
            --primary-light: #eff6ff;
            --navy: #0f172a;
            --slate: #334155;
            --gray-bg: #f8fafc;
            --border: #e2e8f0;
            --white: #ffffff;
            --text: #1e293b;
            --text-muted: #64748b;
            --accent: #3b82f6;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--gray-bg);
            color: var(--text);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            font-size: 14px;
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ─── NAV ─── */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 5%;
            height: 70px;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 900;
            font-size: 24px;
            color: var(--navy);
            text-decoration: none;
            font-family: 'Outfit', sans-serif;
            letter-spacing: -0.025em;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #0ea5e9 0%, #d946ef 100%);
            border-radius: 10px;
            display: grid;
            place-items: center;
            color: white;
            font-size: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .nav-logo span {
            background: linear-gradient(135deg, #0ea5e9 0%, #d946ef 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* ─── MAIN CONTENT ─── */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 100px 5% 60px;
            background: linear-gradient(135deg, var(--gray-bg) 0%, #edf2f7 100%);
        }

        .auth-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 48px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
            animation: fadeUp 0.8s ease both;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .auth-header h1 {
            font-size: 28px;
            font-weight: 800;
            color: var(--navy);
            margin-bottom: 12px;
        }

        .auth-header p {
            color: var(--text-muted);
            font-size: 15px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--slate);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 18px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-family: inherit;
            font-size: 14px;
            transition: all 0.2s;
            background: #fdfdfd;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-light);
            background: white;
        }

        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .password-wrapper input {
            padding-right: 50px;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 700;
            user-select: none;
            padding: 4px;
            background: none;
            border: none;
            outline: none;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .toggle-password:hover {
            color: var(--primary);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }

        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .alert {
            padding: 14px 18px;
            border-radius: 10px;
            margin-bottom: 24px;
            font-size: 14px;
            display: none;
        }

        .alert-error {
            background: #fef2f2;
            border: 1px solid #fee2e2;
            color: #b91c1c;
        }

        .footer-link {
            text-align: center;
            margin-top: 32px;
            color: var(--text-muted);
            font-size: 14px;
        }

        .footer-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
        }

        .footer-link a:hover {
            text-decoration: underline;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            .auth-card {
                padding: 32px 24px;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }
        }
    </style>
</head>

<body>

    <nav>
        <a href="/" class="nav-logo group">
            <div class="logo-icon group-hover:scale-110 transition-transform">📦</div>
            <span>INVPRO</span>
        </a>
    </nav>

    <main>
        <div class="auth-card">
            <div class="auth-header">
                <h1>Create Business</h1>
                <p>Set up your shop network today</p>
            </div>

            <div id="alertBox" class="alert alert-error"></div>

            <form id="registerForm">
                <div class="form-group">
                    <label for="chain_name">Business / Shop Name</label>
                    <input type="text" id="chain_name" name="chain_name" placeholder="E.g. Global Retail Pro" required>
                </div>

                <div class="form-group">
                    <label for="username">Owner Username</label>
                    <input type="text" id="username" name="username" placeholder="Pick a username" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="password" name="password" placeholder="••••••••" required>
                            <button type="button" class="toggle-password"
                                onclick="togglePassword('password', this)">Show</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="confirm_password">Confirm</label>
                        <div class="password-wrapper">
                            <input type="password" id="confirm_password" name="confirm_password" placeholder="••••••••"
                                required>
                            <button type="button" class="toggle-password"
                                onclick="togglePassword('confirm_password', this)">Show</button>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">Initialize Workspace</button>
            </form>

            <div class="footer-link">
                Already have a protocol? <a href="/#login">Secure Entrance</a>
            </div>
        </div>
    </main>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const alertBox = document.getElementById('alertBox');

            const pwd = document.getElementById('password').value;
            const cpwd = document.getElementById('confirm_password').value;

            if (pwd !== cpwd) {
                alertBox.textContent = "Passwords do not match.";
                alertBox.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Initializing...';
            alertBox.style.display = 'none';

            const formData = new FormData(this);

            try {
                const response = await fetch('/auth/register', {
                    method: 'POST',
                    body: formData,
                    headers: { 'Accept': 'application/json' }
                });
                const data = await response.json();

                if (response.ok && data.success) {
                    window.location.href = data.redirect || '/dashboard';
                } else {
                    alertBox.textContent = data.message || 'Registration failed.';
                    alertBox.style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = 'Initialize Workspace';
                }
            } catch (error) {
                alertBox.textContent = 'Network error. Please try again.';
                alertBox.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Initialize Workspace';
            }
        });

        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = 'Hide';
            } else {
                input.type = 'password';
                btn.textContent = 'Show';
            }
        }
    </script>
</body>

</html>
