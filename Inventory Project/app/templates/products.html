<!DOCTYPE html>
<html lang="en" class="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock - Branch Inventory</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio&preflight=true"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: { 50: '#f0f9ff', 100: '#e0f2fe', 200: '#bae6fd', 300: '#7dd3fc', 400: '#38bdf8', 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1', 800: '#075985', 900: '#0c4a6e' },
                        accent: { 50: '#fdf4ff', 100: '#fae8ff', 200: '#f5d0fe', 300: '#f0abfc', 400: '#e879f9', 500: '#d946ef', 600: '#c026d3', 700: '#a21caf', 800: '#86198f', 900: '#701a75' }
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'], display: ['Outfit', 'Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <style>
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }

        .dark .glass {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-strong {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
        }

        .dark .glass-strong {
            background: rgba(15, 23, 42, 0.9);
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            font-size: 0.875rem;
            font-weight: 700;
            color: #475569;
            transition: all 0.2s;
            text-decoration: none;
        }

        .nav-item.active {
            background: linear-gradient(to right, #0ea5e9, #d946ef);
            color: white;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #0ea5e9 0%, #d946ef 100%);
            border-radius: 10px;
            display: grid;
            place-items: center;
            color: white;
            font-size: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .card-soft {
            background: white;
            border-radius: 2rem;
            border: 1px solid #f1f5f9;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .dark .card-soft {
            background: #0f172a;
            border-color: #1e293b;
        }

        .form-input-professional {
            width: 100%;
            padding: 0.75rem 1rem;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 1rem;
            font-size: 0.875rem;
            font-weight: 600;
            transition: all 0.2s;
        }

        .dark .form-input-professional {
            background-color: #020617;
            border-color: #1e293b;
            color: white;
        }
    </style>
</head>

<body
    class="bg-gradient-to-br from-slate-50 via-blue-50 to-purple-50 dark:from-slate-950 dark:via-slate-900 dark:to-slate-950 min-h-screen">

    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-64 glass-strong border-r border-slate-200/50 dark:border-slate-800/50 flex flex-col">
            <div class="p-6 border-b border-slate-200/50 dark:border-slate-800/50">
                <a href="/" class="nav-logo group">
                    <div class="logo-icon group-hover:scale-110 transition-transform">📦</div>
                    <span
                        class="text-2xl font-black bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent"
                        style="font-family: 'Outfit';">INVPRO</span>
                </a>
                <p id="ctx-chain-name" class="text-[10px] text-slate-500 font-black uppercase tracking-widest mt-2">...
                </p>
            </div>
            <nav id="sidebar-nav" class="flex-1 p-4 space-y-1 overflow-y-auto">
                <!-- Nav Items injected via JS -->
            </nav>
            <div class="p-4 border-t border-slate-200/50 dark:border-slate-800/50">
                <div class="flex items-center gap-3 mb-3">
                    <div id="user-avatar"
                        class="w-10 h-10 rounded-full bg-gradient-to-br from-blue-500 to-purple-500 flex items-center justify-center text-white font-bold">
                        ?</div>
                    <div class="flex-1 min-w-0">
                        <p id="ctx-username" class="text-sm font-bold text-slate-900 dark:text-white truncate">
                            Loading...</p>
                        <p id="ctx-role" class="text-xs text-slate-500 truncate">...</p>
                    </div>
                </div>
                <div class="flex gap-2">
                    <button onclick="toggleTheme()"
                        class="flex-1 px-3 py-2 text-xs font-bold rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 transition-colors"><i
                            class="bi bi-moon-stars-fill dark:hidden"></i><i
                            class="bi bi-sun-fill hidden dark:inline text-white"></i></button>
                    <a href="/auth/logout"
                        class="flex-1 px-3 py-2 text-xs font-bold rounded-lg bg-red-100 dark:bg-red-900/30 text-red-600 dark:text-red-400 hover:bg-red-200 transition-colors text-center"><i
                            class="bi bi-box-arrow-right"></i></a>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto">
            <header
                class="glass-strong border-b border-slate-200/50 dark:border-slate-800/50 px-8 py-4 flex items-center justify-between sticky top-0 z-50">
                <div>
                    <h2 class="text-xl font-bold text-slate-900 dark:text-white" style="font-family: 'Outfit';">Branch
                        Stock</h2>
                    <p class="text-sm text-slate-500">Manage all products available in <span id="header-store-name"
                            class="font-bold text-blue-600">branch</span>.</p>
                </div>
                <div class="text-right">
                    <p id="ctx-store-label" class="text-[10px] font-black text-slate-400 uppercase tracking-widest">
                        Branch</p>
                    <p id="ctx-store-name" class="text-sm font-bold text-slate-900 dark:text-white">...</p>
                </div>
            </header>

            <div class="p-8 space-y-8 max-w-[1400px] mx-auto">
                <!-- Search & Filters -->
                <div class="card-soft p-4 flex flex-col lg:flex-row gap-4">
                    <div class="relative flex-grow">
                        <i class="bi bi-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="text" id="searchInput" placeholder="Search products..."
                            class="w-full pl-11 pr-4 py-2.5 bg-slate-50 dark:bg-slate-950 border-transparent rounded-xl text-sm focus:ring-2 focus:ring-blue-600/20 transition-all">
                    </div>
                    <div class="flex flex-col sm:flex-row gap-3">
                        <select id="categoryFilter"
                            class="bg-slate-50 dark:bg-slate-950 border-transparent rounded-xl text-xs font-bold px-4 py-2.5 text-slate-500 uppercase tracking-widest focus:ring-2 focus:ring-blue-600/20">
                            <option value="">All Categories</option>
                        </select>
                        <button id="exportBtn" onclick="exportProducts()"
                            class="hidden px-4 py-2.5 bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300 border border-slate-200 dark:border-slate-800 rounded-xl font-bold text-xs transition-all hover:bg-slate-50 dark:hover:bg-slate-800 flex items-center gap-2">
                            <i class="bi bi-download"></i> Export
                        </button>
                        <a href="/inventory/import-view" id="importBtn"
                            class="hidden px-5 py-2.5 bg-indigo-600 text-white rounded-xl text-xs font-black uppercase tracking-widest flex items-center gap-2 shadow-lg shadow-indigo-600/20 active:scale-95 transition-all text-center">
                            <i class="bi bi-cloud-download-fill"></i> Import from HQ
                        </a>
                    </div>
                </div>

                <!-- Products Grid -->
                <div id="productsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                    <div class="h-64 bg-slate-100 dark:bg-slate-800 rounded-3xl animate-pulse"></div>
                    <div class="h-64 bg-slate-100 dark:bg-slate-800 rounded-3xl animate-pulse"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modals -->
    <!-- Edit Modal configured for local overrides -->
    <div class="modal fade" id="editModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content border-0 shadow-2xl rounded-[2rem] overflow-hidden dark:bg-slate-900">
                <div class="bg-indigo-600 p-8 flex justify-between items-center text-white">
                    <div>
                        <h5 class="text-xl font-black mb-1">Adjust Branch Stock</h5>
                        <p class="text-xs text-indigo-100 font-bold uppercase tracking-widest opacity-80">Local Pricing
                            & Inventory</p>
                    </div>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form id="editProductForm" class="p-10 space-y-6">
                    <input type="hidden" id="editProductId">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <div class="space-y-4">
                            <div>
                                <label
                                    class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 block">Product
                                    Name</label>
                                <input type="text" id="editName" name="name" required readonly
                                    class="form-input-professional bg-slate-100 dark:bg-slate-950 opacity-70">
                            </div>
                            <div>
                                <label
                                    class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 block">Category</label>
                                <select id="editCategorySelect" name="category_id" disabled
                                    class="form-input-professional bg-slate-100 dark:bg-slate-950 opacity-70"></select>
                            </div>
                        </div>
                        <div class="space-y-4">
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label
                                        class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 block">Local
                                        Cost Price</label>
                                    <input type="number" step="0.01" id="editCostPrice" name="cost_price" required
                                        class="form-input-professional">
                                </div>
                                <div>
                                    <label
                                        class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 block">Local
                                        Selling Price</label>
                                    <input type="number" step="0.01" id="editSellingPrice" name="selling_price" required
                                        class="form-input-professional">
                                </div>
                            </div>
                            <div>
                                <label
                                    class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 block">Quantity
                                    in Stock</label>
                                <input type="number" id="editQuantity" name="quantity" required
                                    class="form-input-professional focus:ring-indigo-600/20">
                            </div>
                        </div>
                    </div>
                    <div class="flex gap-4 pt-6">
                        <button type="button"
                            class="flex-1 py-4 font-bold text-slate-400 hover:text-slate-600 transition-colors"
                            data-bs-dismiss="modal">Cancel</button>
                        <button type="submit"
                            class="flex-[2] py-4 bg-indigo-600 text-white rounded-2xl font-black shadow-lg shadow-indigo-600/20 active:scale-95 transition-all">Apply
                            Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="modal fade" id="deleteModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-2xl rounded-[2rem] p-10 text-center dark:bg-slate-900">
                <div
                    class="w-16 h-16 bg-red-100 text-red-600 rounded-full flex items-center justify-center text-3xl mx-auto mb-4">
                    <i class="bi bi-trash-fill"></i>
                </div>
                <h3 class="text-xl font-black mb-2">Delete Product?</h3>
                <p class="text-slate-500 mb-8">This action cannot be undone.</p>
                <form id="deleteProductForm" class="flex gap-4"><button type="button"
                        class="flex-1 py-3 font-bold text-slate-400" data-bs-dismiss="modal">No</button><button
                        type="submit" id="confirmDeleteBtn"
                        class="flex-[2] py-3 bg-red-600 text-white rounded-2xl font-black">Yes,
                        Delete</button></form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // System JS
        function toggleTheme() {
            const html = document.documentElement;
            const isDark = html.classList.contains('dark');
            html.classList.remove(isDark ? 'dark' : 'light');
            html.classList.add(isDark ? 'light' : 'dark');
            localStorage.setItem('theme', isDark ? 'light' : 'dark');
        }

        let SESSION_DATA = {};
        async function loadSessionContext() {
            try {
                const res = await fetch('/api/session-context');
                const ctx = await res.json();
                SESSION_DATA = ctx;
                document.getElementById('ctx-chain-name').textContent = ctx.store_name || ctx.chain_name || 'INVPRO';
                document.getElementById('ctx-username').textContent = ctx.username;
                document.getElementById('ctx-role').textContent = ctx.role === 'business_admin' ? 'HQ Admin' : ctx.role === 'branch_admin' ? 'Manager' : 'Staff';
                document.getElementById('user-avatar').textContent = ctx.username[0].toUpperCase();
                document.getElementById('ctx-store-name').textContent = ctx.store_name || 'HQ';
                document.getElementById('header-store-name').textContent = ctx.store_name || 'Branch';
                renderSidebar(ctx.role);

                // Show Import button for Managers
                if (ctx.role === 'branch_admin') {
                    document.getElementById('importBtn').classList.remove('hidden');
                    document.getElementById('exportBtn').classList.remove('hidden'); // Added export button visibility
                }
            } catch (e) { console.error(e); }
        }

        function renderSidebar(role) {
            const nav = document.getElementById('sidebar-nav');
            const path = window.location.pathname;

            let menu = [];
            if (role === 'business_admin') {
                menu = [
                    { name: 'Home', icon: 'bi-grid-fill', url: '/' },
                    { name: 'Master Product List', icon: 'bi-box-seam-fill', url: '/inventory/global' },
                    { name: 'Product Categories', icon: 'bi-tags-fill', url: '/inventory/categories' },
                    { name: 'Shops & Branches', icon: 'bi-building', url: '/settings/' },
                    { name: 'Tax Rates', icon: 'bi-percent', url: '/settings/tax' },
                    { name: 'Staff Users', icon: 'bi-people-fill', url: '/users/' },
                    { name: 'Sales Reports', icon: 'bi-graph-up', url: '/sales/reports' },

                ];
            } else if (role === 'branch_admin') {
                menu = [
                    { name: 'Home', icon: 'bi-grid-fill', url: '/' },
                    { name: 'Shop Stock', icon: 'bi-box-seam', url: '/inventory/products' },
                    { name: 'Billing Counter', icon: 'bi-cart4', url: '/billing/' },
                    { name: 'My Team', icon: 'bi-people', url: '/users/' },
                    { name: 'Reports', icon: 'bi-graph-up', url: '/sales/reports' }
                ];
            } else {
                menu = [
                    { name: 'Billing Counter', icon: 'bi-cart4', url: '/billing/' },
                    { name: 'Check Stock', icon: 'bi-eye', url: '/inventory/products' }
                ];
            }

            nav.innerHTML = menu.map(item => `
                <a href="${item.url}" class="nav-item ${path === item.url ? 'active' : ''}">
                    <i class="bi ${item.icon}"></i>
                    <span>${item.name}</span>
                </a>
            `).join('');
        }

        document.addEventListener('DOMContentLoaded', () => {
            const theme = localStorage.getItem('theme') || 'light';
            document.documentElement.classList.add(theme);
            loadSessionContext();
        });

        const URL_PARAMS = new URLSearchParams(window.location.search);
        const FILTER_TYPE = URL_PARAMS.get('filter');
    </script>
    <script src="/static/js/products.js"></script>
</body>

</html>
