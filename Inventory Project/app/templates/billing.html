<!DOCTYPE html>
<html lang="en" class="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Terminal - Inventory Pro</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio&preflight=true"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: { 50: '#f0f9ff', 100: '#e0f2fe', 200: '#bae6fd', 300: '#7dd3fc', 400: '#38bdf8', 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1', 800: '#075985', 900: '#0c4a6e' },
                        accent: { 50: '#fdf4ff', 100: '#fae8ff', 200: '#f5d0fe', 300: '#f0abfc', 400: '#e879f9', 500: '#d946ef', 600: '#c026d3', 700: '#a21caf', 800: '#86198f', 900: '#701a75' }
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'], display: ['Outfit', 'Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <style>
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }

        .dark .glass {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-strong {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
        }

        .dark .glass-strong {
            background: rgba(15, 23, 42, 0.9);
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            font-size: 0.875rem;
            font-weight: 700;
            color: #475569;
            transition: all 0.2s;
            text-decoration: none;
        }

        .nav-item:hover {
            background: #f1f5f9;
        }

        .dark .nav-item {
            color: #94a3b8;
        }

        .dark .nav-item:hover {
            background: #1e293b;
        }

        .nav-item.active {
            background: linear-gradient(to right, #0ea5e9, #d946ef);
            color: white;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #0ea5e9 0%, #d946ef 100%);
            border-radius: 10px;
            display: grid;
            place-items: center;
            color: white;
            font-size: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .card-soft {
            background: white;
            border-radius: 2rem;
            border: 1px solid #f1f5f9;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .dark .card-soft {
            background: #0f172a;
            border-color: #1e293b;
        }
    </style>
</head>

<body
    class="bg-gradient-to-br from-slate-50 via-blue-50 to-purple-50 dark:from-slate-950 dark:via-slate-900 dark:to-slate-950 min-h-screen">

    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-64 glass-strong border-r border-slate-200/50 dark:border-slate-800/50 flex flex-col">
            <div class="p-6 border-b border-slate-200/50 dark:border-slate-800/50">
                <a href="/" class="nav-logo group">
                    <div class="logo-icon group-hover:scale-110 transition-transform">📦</div>
                    <span
                        class="text-2xl font-black bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent"
                        style="font-family: 'Outfit';">INVPRO</span>
                </a>
                <p id="ctx-chain-name" class="text-[10px] text-slate-500 font-black uppercase tracking-widest mt-2">...
                </p>
            </div>
            <nav id="sidebar-nav" class="flex-1 p-4 space-y-1 overflow-y-auto">
                <!-- Data injected via JS -->
            </nav>
            <div class="p-4 border-t border-slate-200/50 dark:border-slate-800/50">
                <div class="flex items-center gap-3 mb-3">
                    <div id="user-avatar"
                        class="w-10 h-10 rounded-full bg-gradient-to-br from-blue-500 to-purple-500 flex items-center justify-center text-white font-bold">
                        ?</div>
                    <div class="flex-1 min-w-0">
                        <p id="ctx-username" class="text-sm font-bold text-slate-900 dark:text-white truncate">
                            Loading...</p>
                        <p id="ctx-role" class="text-xs text-slate-500 truncate">...</p>
                    </div>
                </div>
                <div class="flex gap-2">
                    <button onclick="toggleTheme()"
                        class="flex-1 px-3 py-2 text-xs font-bold rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 transition-colors">
                        <i class="bi bi-moon-stars-fill dark:hidden"></i>
                        <i class="bi bi-sun-fill hidden dark:inline text-white"></i>
                    </button>
                    <a href="/auth/logout"
                        class="flex-1 px-3 py-2 text-xs font-bold rounded-lg bg-red-100 dark:bg-red-900/30 text-red-600 dark:text-red-400 hover:bg-red-200 transition-colors text-center">
                        <i class="bi bi-box-arrow-right"></i>
                    </a>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto flex flex-col">
            <header
                class="glass-strong border-b border-slate-200/50 dark:border-slate-800/50 px-8 py-4 flex items-center justify-between">
                <div>
                    <h2 class="text-xl font-bold text-slate-900 dark:text-white" style="font-family: 'Outfit';">Billing
                        Counter</h2>
                    <p class="text-sm text-slate-500">Shop Sales Counter</p>
                </div>
                <div class="text-right">
                    <p id="ctx-store-label" class="text-[10px] font-black text-slate-400 uppercase tracking-widest">
                        Shop</p>
                    <p id="ctx-store-name" class="text-sm font-bold text-slate-900 dark:text-white">...</p>
                </div>
            </header>

            <div class="p-8 flex-1">
                <!-- Terminal Content -->
                <div
                    class="h-[calc(100vh-12rem)] card-soft flex flex-col lg:flex-row overflow-hidden bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-[2.5rem] shadow-2xl">
                    <!-- Product Selection (70%) -->
                    <div class="flex-grow lg:w-[60%] flex flex-col overflow-hidden">
                        <div class="px-6 py-5 border-b border-slate-100 dark:border-slate-800 flex flex-col gap-4">
                            <div class="flex items-center justify-between">
                                <h3
                                    class="text-lg font-black text-slate-900 dark:text-white uppercase tracking-tighter">
                                    Inventory Grid</h3>
                                <div id="billDate" class="text-xs font-bold text-slate-500"></div>
                            </div>
                            <div class="relative group">
                                <i
                                    class="bi bi-upc-scan absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-blue-600 transition-colors"></i>
                                <input type="text" id="productSearch" placeholder="Scan or search products..."
                                    class="w-full pl-12 pr-4 py-3 bg-slate-50 dark:bg-slate-950 border-0 rounded-2xl text-sm font-medium focus:ring-2 focus:ring-blue-600/20 transition-all">
                            </div>
                        </div>

                        <div class="flex-1 overflow-y-auto p-6" id="productGrid">
                            <!-- JS Injection -->
                        </div>
                    </div>

                    <!-- Order Summary (30%) -->
                    <div
                        class="lg:w-[40%] border-l border-slate-100 dark:border-slate-800 flex flex-col bg-slate-50/50 dark:bg-slate-900/10">
                        <div class="p-6 border-b border-slate-100 dark:border-slate-800">
                            <h3
                                class="text-sm font-black text-slate-900 dark:text-white uppercase tracking-widest mb-4">
                                Customer Details</h3>
                            <div class="space-y-3">
                                <input type="text" id="customerPhone" placeholder="Phone Number"
                                    class="w-full px-4 py-2.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs font-bold">
                                <input type="text" id="customerName" placeholder="Customer Name"
                                    class="w-full px-4 py-2.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs font-bold">
                            </div>
                        </div>

                        <div class="flex-1 overflow-y-auto p-4 space-y-2" id="cartBody">
                            <!-- Items -->
                            <div id="emptyCartMessage" class="py-10 text-center">
                                <div
                                    class="w-12 h-12 bg-slate-100 dark:bg-slate-800 rounded-full flex items-center justify-center mx-auto mb-3">
                                    <i class="bi bi-cart3 text-xl text-slate-400"></i>
                                </div>
                                <p class="text-xs font-bold text-slate-400">No items added yet</p>
                            </div>
                        </div>

                        <div class="p-6 bg-white dark:bg-slate-900 border-t border-slate-100 dark:border-slate-800">
                            <p id="itemCount"
                                class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3">0 Items</p>
                            <div class="flex justify-between text-xs text-slate-500 mb-1">
                                <span>Subtotal</span>
                                <span id="subtotalDisplay">₹0.00</span>
                            </div>
                            <div class="flex justify-between text-xs text-slate-500 mb-3">
                                <span>Tax</span>
                                <span id="taxDisplay">+₹0.00</span>
                            </div>
                            <div class="flex justify-between items-center mb-4">
                                <span class="text-xs font-black text-slate-400 uppercase tracking-widest">Total
                                    Payable</span>
                                <span class="text-2xl font-black text-slate-900 dark:text-white">₹<span id="cartTotal"
                                        data-tax-rate="18">0.00</span></span>
                            </div>
                            <button id="checkoutBtn"
                                class="w-full py-4 bg-blue-600 text-white rounded-2xl font-black text-xs uppercase tracking-widest shadow-xl shadow-blue-600/20 hover:scale-[1.02] active:scale-95 transition-all">Complete
                                Checkout</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modals & Global UI -->
    <div class="modal fade" id="invoiceModal" tabindex="-1" data-bs-backdrop="static">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-2xl rounded-[2.5rem] dark:bg-slate-900 overflow-hidden">
                <div class="modal-body p-0 text-center"></div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="appAlertModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content border-0 shadow-2xl rounded-[2rem] dark:bg-slate-900 p-8 text-center">
                <div id="appAlertIconContainer"
                    class="w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4"><i id="appAlertIcon"
                        class="bi text-2xl"></i></div>
                <h3 id="appAlertTitle" class="text-lg font-black uppercase mb-2">Alert</h3>
                <p id="appAlertMessage" class="text-sm text-slate-500 mb-6"></p><button type="button"
                    class="w-full py-3 bg-slate-900 dark:bg-white text-white dark:text-slate-900 rounded-xl font-bold text-xs uppercase"
                    data-bs-dismiss="modal">Acknowledge</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        // Common App Logic (Theme, Sidebar, Context)
        function toggleTheme() {
            const html = document.documentElement;
            const isDark = html.classList.contains('dark');
            html.classList.remove(isDark ? 'dark' : 'light');
            html.classList.add(isDark ? 'light' : 'dark');
            localStorage.setItem('theme', isDark ? 'light' : 'dark');
        }

        let SESSION_DATA = {};
        async function loadSessionContext() {
            try {
                const res = await fetch('/api/session-context');
                const ctx = await res.json();
                SESSION_DATA = ctx;
                document.getElementById('ctx-chain-name').textContent = ctx.store_name || ctx.chain_name;
                document.getElementById('ctx-username').textContent = ctx.username;
                document.getElementById('ctx-role').textContent = ctx.role === 'business_admin' ? 'HQ Admin' : ctx.role === 'branch_admin' ? 'Manager' : 'Staff';
                document.getElementById('user-avatar').textContent = ctx.username[0].toUpperCase();
                document.getElementById('ctx-store-name').textContent = ctx.store_name || 'HQ';
                document.getElementById('cartTotal').dataset.taxRate = ctx.tax_rate;
                renderSidebar(ctx.role);
            } catch (e) { console.error(e); }
        }

        function renderSidebar(role) {
            const nav = document.getElementById('sidebar-nav');
            const path = window.location.pathname;

            let menu = [];
            if (role === 'business_admin') {
                menu = [
                    { name: 'Home', icon: 'bi-grid-fill', url: '/' },
                    { name: 'Master Product List', icon: 'bi-box-seam-fill', url: '/inventory/global' },
                    { name: 'Product Categories', icon: 'bi-tags-fill', url: '/inventory/categories' },
                    { name: 'Shops & Branches', icon: 'bi-building', url: '/settings/' },
                    { name: 'Tax Rates', icon: 'bi-percent', url: '/settings/tax' },
                    { name: 'Staff Users', icon: 'bi-people-fill', url: '/users/' },
                    { name: 'Sales Reports', icon: 'bi-graph-up', url: '/sales/reports' },
                ];
            } else if (role === 'branch_admin') {
                menu = [
                    { name: 'Home', icon: 'bi-grid-fill', url: '/' },
                    { name: 'Shop Stock', icon: 'bi-box-seam', url: '/inventory/products' },
                    { name: 'Billing Counter', icon: 'bi-cart4', url: '/billing/' },
                    { name: 'My Team', icon: 'bi-people', url: '/users/' },
                    { name: 'Reports', icon: 'bi-graph-up', url: '/sales/reports' }
                ];
            } else {
                menu = [
                    { name: 'Billing Counter', icon: 'bi-cart4', url: '/billing/' },
                    { name: 'Check Stock', icon: 'bi-eye', url: '/inventory/products' }
                ];
            }

            nav.innerHTML = menu.map(item => `
                <a href="${item.url}" class="nav-item ${path === item.url ? 'active' : ''}">
                    <i class="bi ${item.icon}"></i>
                    <span>${item.name}</span>
                </a>
            `).join('');
        }

        function showAlert(message, type = 'warning', title = 'Attention') {
            const modal = new bootstrap.Modal(document.getElementById('appAlertModal'));
            document.getElementById('appAlertTitle').textContent = title;
            document.getElementById('appAlertMessage').textContent = message;
            modal.show();
        }

        document.addEventListener('DOMContentLoaded', () => {
            const theme = localStorage.getItem('theme') || 'light';
            document.documentElement.classList.add(theme);
            loadSessionContext();
        });
    </script>
    <script src="/static/js/billing.js"></script>
</body>

</html>
